version: "2"
plugins:
  - name: py
    wasm:
      url: https://downloads.sqlc.dev/plugin/sqlc-gen-python_1.3.0.wasm
      sha256: fbedae96b5ecae2380a70fb5b925fd4bff58a6cfb1f3140375d098fbab7b3a3c
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/agent
    codegen:
      - out: src/generated/agent
        plugin: py
        options:
          package: generated.agent
          emit_async_querier: true
          emit_sync_querier: false
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/projects
    codegen:
      - out: src/generated/projects
        plugin: py
        options:
          package: generated.projects
          emit_async_querier: true
          emit_sync_querier: false
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/users
    codegen:
      - out: src/generated/users
        plugin: py
        options:
          package: generated.users
          emit_async_querier: true
          emit_sync_querier: false
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/organizations
    codegen:
      - out: src/generated/organizations
        plugin: py
        options:
          package: generated.organizations
          emit_async_querier: true
          emit_sync_querier: false
