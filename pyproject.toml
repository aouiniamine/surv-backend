[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "surv-backend"
version = "0.1.0"
description = "Surv application hosting API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosmtplib>=4,<6",
  "asyncpg>=0.30,<1",
  "email-validator>=2,<3",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "pydantic-settings>=2.8,<3",
  "redis>=5,<9",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
only-include = ["src/core", "src/domains", "src/generated", "src/main.py", "src/templates"]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
exclude = ["src/generated"]
